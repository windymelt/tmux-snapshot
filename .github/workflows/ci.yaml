name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7
      - run: sbt compile

  # Runs the same runners and the same build.sh as release.yml, so a native
  # link or smoke-test failure surfaces here rather than on a tag push.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-linux
          - runner: ubuntu-22.04-arm
            target: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7

      # ubuntu-22.04 ships clang 14, which Scala Native reports as deprecated
      # and whose ThinLTO aborts on conflicting 'PIC Level' module flags.
      # jammy's own archive stops at clang 15, so LLVM's apt repository
      # supplies 18. Moving to a newer runner instead would raise the minimum
      # glibc above 2.35 and drop Debian 12 and Ubuntu 22.04 users.
      # Kept identical to the same step in release.yml.
      - name: Install clang 18
        env:
          LLVM_VERSION: '18'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-${LLVM_VERSION}" \
            "lld-${LLVM_VERSION}" \
            "llvm-${LLVM_VERSION}" \
            "llvm-${LLVM_VERSION}-linker-tools"
          # Scala Native resolves its toolchain by running `which
          # $LLVM_BIN/clang`, so LLVM_BIN must be a directory holding the
          # binaries under their unversioned names. /usr/lib/llvm-18/bin does;
          # /usr/bin holds only the clang-18 suffixed symlinks.
          echo "LLVM_BIN=/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_ENV"
          "/usr/lib/llvm-${LLVM_VERSION}/bin/clang" --version

      - name: Build native binary
        run: ./build.sh

      - name: Install tmux
        run: sudo apt-get install -y --no-install-recommends tmux

      # `list` needs --session or --all when it is not run from inside tmux.
      - name: Smoke-test the binary
        run: |
          tmux new-session -d -s smoke
          ./tmux-snapshot --state "$RUNNER_TEMP/smoke.json" dump
          grep -q '"smoke"' "$RUNNER_TEMP/smoke.json"
          ./tmux-snapshot --all list
          ./tmux-snapshot --session smoke --json list
          # CI never sets TMUX_SNAPSHOT_VERSION, so the placeholder is the
          # expected value here; asserting it catches a BuildInfo wiring break.
          ./tmux-snapshot --version | grep -q '0\.0\.0-SNAPSHOT'

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmux-snapshot-${{ matrix.target }}
          path: tmux-snapshot
