name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7
      - run: sbt compile

  # Runs the same runners and the same build.sh as release.yml, so a native
  # link or smoke-test failure surfaces here rather than on a tag push.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-linux
          - runner: ubuntu-22.04-arm
            target: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7

      - name: Build native binary
        run: ./build.sh

      # The runner has no tmux server, so `dump` returns via its safety guard
      # and `list` exits 1. Both still traverse process startup, which is what
      # a Scala Native miscompilation would break. The loop catches an
      # intermittent crash that a single run would miss; a segfault shows up as
      # 139 rather than the expected status.
      #
      # --state must be passed so the run never touches a real snapshot.
      - name: Smoke-test the binary
        run: |
          for i in $(seq 1 25); do
            ./tmux-snapshot --state "$RUNNER_TEMP/smoke.json" dump

            status=0
            ./tmux-snapshot list || status=$?
            if [ "$status" -ne 1 ]; then
              echo "iteration $i: 'list' exited with $status, expected 1" >&2
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmux-snapshot-${{ matrix.target }}
          path: tmux-snapshot
