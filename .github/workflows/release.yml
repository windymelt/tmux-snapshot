name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          # Binaries are glibc-dynamic, so the runner's glibc becomes the
          # minimum supported version. ubuntu-22.04 pins that floor to 2.35.
          - runner: ubuntu-22.04
            target: x86_64-linux
          - runner: ubuntu-22.04-arm
            target: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build native binary
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmux-snapshot-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: tmux-snapshot

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # attest-build-provenance signs with an OIDC token and writes the
      # attestation to the repository.
      id-token: write
      attestations: write
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # Each artifact arrives as a directory named after the asset, holding a
      # single `tmux-snapshot` file. The upload/download round trip drops the
      # executable bit, so it is set again here.
      - name: Prepare release assets
        run: |
          mkdir release
          for dir in artifacts/tmux-snapshot-*; do
            name=$(basename "$dir")
            chmod +x "$dir/tmux-snapshot"
            mv "$dir/tmux-snapshot" "release/$name"
          done

      # sha256sum output format, so consumers can verify with
      # `sha256sum --check --ignore-missing checksums.txt`.
      - name: Generate checksums
        run: |
          cd release
          sha256sum tmux-snapshot-* > checksums.txt

      # Proves each binary was produced by this workflow run. Consumers verify
      # with `gh attestation verify <file> --repo windymelt/tmux-snapshot`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/tmux-snapshot-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*
